name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege (Phase 15E.3): this workflow only reads the repository.
# The job's check run ("test-and-build") is the production deployment gate,
# so it needs no write access of any kind.
permissions:
  contents: read

jobs:
  # Keep this job name: "test-and-build" is the required check that the
  # deploy gates (Railway "Wait for CI", Vercel Deployment Checks, the main
  # branch ruleset) refer to.
  test-and-build:
    runs-on: ubuntu-latest
    # Throwaway PostgreSQL for the database suites (Phase 15E.4b): the
    # refresh-token concurrency invariants can only be proven against a real
    # database. It lives and dies with this job, is reachable only from the
    # runner, and holds no data but what the tests create — so it uses trust
    # authentication and needs no credential at all. Pinned by digest
    # (postgres:16-alpine, multi-arch index).
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: myandijan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d myandijan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # Actions are pinned to full commit SHAs (immutable — a moved or
      # compromised tag cannot change what runs in the gate); the comment
      # names the release. Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Real-PostgreSQL suites: migrations deploy on an empty database and on
      # pre-15E.4b data; concurrent refreshes of one token yield exactly one
      # successor. test/db/support.ts refuses any non-local or non-test database.
      - name: Run database tests
        run: npm run test:db
        env:
          TEST_DATABASE_URL: postgresql://postgres@localhost:5432/myandijan_test

      - name: Build
        run: npm run build
