version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: my-andijan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: andijan
      POSTGRES_PASSWORD: andijan_dev_password
      POSTGRES_DB: my_andijan
    ports:
      - "5432:5432"
    volumes:
      - my_andijan_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U andijan -d my_andijan"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  my_andijan_pgdata:
